server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: banking-ledger-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ledger?sslmode=disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
